<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>index</title>
</head>
<body>

    <header>

      <nav class="navbar navbar-expand-lg navbar-Betancourt">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-lg-center gap-2">
            <img src="/img/logo.png" alt="logo taller" class="logo">
            <span class="Nombre">TALLER DE BETANCOURT</span>
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#index">
          <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="index" >
            <ul class="navbar-nav ms-auto aling-items-lg-center gap-3">
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">INICIO</a></li>
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">SERVICIOS</a></li>
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">NOSOTROS</a></li>
              
              <li class="nav-item">
                <button class="btn-login-nav" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
              </li>
              
              <li class="nav-item">
                <button class="btn-contactenos-nav" data-bs-toggle="modal" data-bs-target="#contactenosModal">Contactenos</button>
              </li>  
            </ul>

          </div>
        </div>
      </nav>
    </header>

    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-login">
          <div class="modal-header border-0">
            <h2 class="modal-title w-100 text-center">Iniciar Sesion</h2>
            <button type="button" class="btn-close" data-bs-dimiss="modal"></button>
          </div>
          <div class="modal-body">
            <form action="">
              <div class="mb-3">
                <label for="email" class="form-label">Usuario</label>
                <input type="email" class="form-control" id="email" placeholder="Ingrese su Usuario" required>
                <br>
              <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Ingrese su Contraseña" required>
              </div>  
              <button type="submit" class="btn btn-login w-100">Ingresar</button>
              <div class="d-flex justify-content-between mt-3">
                <a href="#" class="link-login">¿Olvido Su Contraseña?</a>
              </div>
            </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="contactenosModal">
    
    </div>

    <section></section>


   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
