<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/a0994db117.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/pedidos.css">
    <link rel="shortcut icon" href="../img/icono.png" type="image/x-icon">
    <link rel="icon" href="../img/logo.png">
    <title>Pedidos Taller De Betancourt</title>
</head>

<body>`
    <div class="dashboard-layout">

        <aside class="sidebar offcanvas offcanvas-start show" tabindex="-1" id="sidebarMenu">

            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="">
                <h2> Taller De Betancourt</h2>

                <p>Gestion De inventarios</p>
            </div>
            <nav class="sidebar-menu">

                <a href="/pages/proveedores.html">
                    <i class="fa-solid fa-truck"></i>
                    Proveedores
                </a>

                <a href="/pages/Gestion_Clientes.html">
                    <i class="fa-regular fa-user"></i>
                    Clientes
                </a>

                <a href="/pages/inventario.html">
                    <i class="fa-solid fa-semibold fa-clipboard-list"></i>
                    Inventario
                </a>
                <a href="/pages/Asignacio.html">
                    <i class="fa-solid fa-semibold fa-clipboard-list"></i>
                    Asignacion Servicios
                </a>
                <a href="../index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    salir
                </a>
            </nav>
        </aside>

        <div class="container">
            <header class="topbar">
                <div>
                    <p>Bienvenido</p>
                </div>
                <div class="inventario-info">
                    <i class="fa-regular fa-user"></i>
                    <span>Gestión de Pedidos</span>
                </div>
            </header>
            <div class="formulario">
                <div class="input-group">
                    <span class="input-group-text">Nombres y apellidos</span>
                    <input type="text" aria-label="First name" class="form-control">
                    <input type="text" aria-label="Last name" class="form-control">
                </div>

                <div class="rol">
                    <label for="">Seleccione su rol en el taller</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected disabled>Seleccione una opcion</option>
                        <option value="1">Jefe del taller</option>
                    </select>
                </div>

                <div class="proveedor">
                    <label for="">Seleccione un proveedor </label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected disabled>Seleccione una opcion</option>
                        <option value="1">Proveedor 1</option>
                        <option value="2">Proveedor 2</option>
                        <option value="3">Proveedor 3</option>
                    </select>
                </div>

                <label for="range4" class="form-label">Cantidad de repuestos requerida</label>
                <input type="range" class="form-range" min="0" max="100" value="50" id="range4">
                <output for="range4" id="rangeValue" aria-hidden="true"></output>

                <div class="importancia">
                    <label for="">Seleccione la importancia del pedido</label> <br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="alta"
                            value="option1">
                        <label class="form-check-label" for="inlineRadio1">Alta</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="media"
                            value="option2">
                        <label class="form-check-label" for="inlineRadio2">Media</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="baja"
                            value="option2">
                        <label class="form-check-label" for="inlineRadio2">Baja</label>
                    </div>
                </div>

                <div class="pagom">
                    <label for="">Seleccione un metodo de pago</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected disabled>Seleccione una opcion</option>
                        <option value="transferencia">Transferencia</option>
                        <option value="efectivo">Efectivo</option>
                    </select>
                </div>

                <button class="btn-enviar">Solicitar Pedido</button>
            </div>



        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script>
            // This is an example script, please modify as needed
            const rangeInput = document.getElementById('range4');
            const rangeOutput = document.getElementById('rangeValue');

            // Set initial value
            rangeOutput.textContent = rangeInput.value;

            rangeInput.addEventListener('input', function () {
                rangeOutput.textContent = this.value;
            });
        </script>
</body>

</html>
