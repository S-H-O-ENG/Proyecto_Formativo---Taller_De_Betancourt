<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
    <link rel="stylesheet" href="/css/inventario.css">
    <link rel="shortcut icon" href="../img/icono.png" type="image/x-icon">
    <link rel="stylesheet" href="/pages/">
    <script src="https://kit.fontawesome.com/a0994db117.js"
    crossorigin="anonymous"></script>
    <title>inventario</title>
</head>
<body>

    <div class="dashboard-layout">
    
        <aside class="sidebar offcanvas offcanvas-start show" tabindex="-1" id="sidebarMenu">
            
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="">
                <h2> Taller De Betancourt</h2>

                <p>Gestion De inventarios</p>
            </div>
            <nav class="sidebar-menu">
                
                <a href="/pages/proveedores.html">
                    <i class="fa-solid fa-truck"></i>
                    Proveedores
                </a>

                <a href="/pages/Gestion_Clientes.html">
                    <i class="fa-regular fa-user"></i>
                    Clientes
                </a>

                <a href="/pages/pedidos.html">
                <i class="fa-solid fa-semibold fa-clipboard-list"></i>
                pedidos
                </a>

                <a href="../index.html">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    salir
                </a>
            </nav>    
        </aside>
    
    
    <main class="dashboard-main">

        <header class="topbar">
            <div>
                
                <p>Bienvenido</p>
            </div>

            <div class="inventario-info">
                <i class="fa-solid fa-boxes-stacked"></i>

                <span>Gestion Inventario</span>
            </div>
        </header>

        <section class="row g-4 mb-4">
            

            <div class="col-lg-4 col-md-4">
                <div class="card-resumen">
                    <i class="fa-solid fa-check-to-slot"></i>
                    <div>
                        <h3>8</h3>
                        <p>Productos activos</p>
                    </div>
                </div>
            </div>
            

            
            <div class="col-lg-4 col-md-4">
                <div class="card-resumen">
                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <div>
                        <h3>4</h3>
                        <p>Productos Con bajo Stock</p>
                    </div>
                </div>
            </div>

            
            <div class="col-lg-4 col-md-4">
                <div class="card-resumen">
                   <i class="fa-solid fa-ban"></i>

                    <div>
                        <h3>2</h3>
                        <p>Productos Sin Stock</p>
                    </div>
                </div>
            </div>
        </section>
        <br>
        <section class="panel-table container-fluid">
            <div class="cabecera-tabla d-flex justify-content-between align-items-center mb-3"">
                <div><span>Productos</span>
                </div>
            <button class="btn btn-inventario" data-bs-toggle="modal" data-bs-target="#modalProducto">
                <i class="fa-solid fa-plus"></i>Agregar
            </button>

             </div>
        </section>
        <br>
        <div class="tabla-inventario">
            <table id="tablaProductos" class="table-aling-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Producto</th>
                        <th>Cantidad</th>
                        <th>Estado</th>
                        <th>Solicitar</th>
                    </tr>
                </thead>

               
            </table>
        </div>

        <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content modal-login">
                    <div class="modal-header border-0">
                        <h2 class="modal-title w-100 text-center" id="modalProductoLabel">Nuevo Producto</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="" id="formProducto">
                            <input type="number" class="form-control mb-3" placeholder="ID Trabajador" required>
                            <input type="text" class="form-control mb-3" placeholder="Nombre" minlength="3" maxlength="20" required>
                            <input type="email" class="form-control mb-3" placeholder="Ingrese Su Usuario" required>

                            <input type="number" id="prodId" class="form-control mb-3" placeholder="ID Producto" required>
    
                            <input type="text" id="prodNombre" class="form-control mb-3" placeholder="Nombre del Producto" minlength="3" maxlength="20" required>
    
                            <input type="number" id="prodCantidad" class="form-control mb-3" placeholder="Cantidad Inicial" min="0" required>
                            


                            <select name="" id="" class="form-select mb-4" required>
                                <option value="">Seleccione su Cargo</option>
                                <option value="Jefe">Jefe De Taller</option>
                                <option value="Mecanico">Mecanico</option>
                                <option value="Asistente">Asistente General</option>
                                <option value="Auxiliar">Auxiliar Servicio Al Cliente</option>
                            </select>

                            <button type="submit" class="btn btn-guardar w-100">
                                Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    </div>
    
    <!-- scripts -->
    <script src="../js/login.js"></script>
    <script src="/JS/inventario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.google.com/p/jquery-ui/"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

</body>
</html>
