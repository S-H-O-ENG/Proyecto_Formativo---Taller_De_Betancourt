<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Proveedores</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/a0994db117.js" crossorigin="anonymous"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/Proveedores.css">
</head>

<body>
    <!-- NAVBAR -->

    <nav class="navbar navbar-dark px-3">

        <button class="btn btn-outline-light"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar">

            <i class="fa-solid fa-bars"></i>

        </button>

        <span class="fw-bold text-white">
            GESTION DE PROVEEDORES
        </span>

    </nav>

    <div class="offcanvas offcanvas-start text-bg-dark"
        tabindex="-1"
        id="sidebar">

        <div class="offcanvas-header">

            <h5>Menú Principal</h5>

            <button class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas">

            </button>

        </div>

        <div class="offcanvas-body">

            <a href="#" class="nav-link text-white mb-2">
                <i class="fa-solid fa-truck"></i>
                Proveedores
            </a>

            <a href="#" class="nav-link text-white mb-2">
                <i class="fa-solid fa-users"></i>
                Clacificacion
            </a>

            <a href="#" class="nav-link text-white mb-2">
                <i class="fa-solid fa-box"></i>
                Facturas
            </a>


            <a href="#" class="nav-link text-danger mt-4">
                <i class="fa-solid fa-right-from-bracket"></i>
                Salir
            </a>

        </div>

    </div>


    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Gestión de Proveedores</h2>

            <button class="btn btn-registrar"
                data-bs-toggle="modal"
                data-bs-target="#modalProveedor">

                <i class="fa-solid fa-plus"></i>

                Registrar proveedor

            </button>

        </div>

        <div class="row g-3 mb-4">

            <div class="col-md-4">

                <div class="card p-3 text-white">

                    <h5>Total proveedores</h5>

                    <h2 id="total">0</h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-3 text-white">

                    <h5>Activos</h5>

                    <h2 id="activos">0</h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-3 text-white">

                    <h5>Pendientes</h5>

                    <h2 id="pendientes">0</h2>

                </div>

            </div>

        </div>

        <div class="card p-3">

            <table id="tablaProveedores"
                class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Proveedor</th>

                        <th>Teléfono</th>

                        <th>Correo</th>

                        <th>Ciudad</th>

                        <th>Estado</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../JS/Proveedores.js"></script>

</body>
</html>
