<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pedidos.css">
    <title>Pedidos Taller De Betancourt</title>
</head>
<body>
    <div class="Container">
        <div class="head">

            <img src="../img/logo.png" alt="Logo" class="logo">
            <h1 class="titulo">Gestion de pedidos - Taller De Betancourt</h1>
        </div>

        <div class="body">
            <label for="Nombre" id="nombre">Nombre/s</label>
            <input type="text" name="" id="inputnombre" required placeholder="Ingrese sus nombres" > <br>
            <label for="apellido">Apellido/s</label>
            <input type="text" name="" id="inputapellido" required placeholder="Ingrese sus apellidos"><br>

            <label for="rol" id="rol">Cargo</label>
            <select name="" id="" class="rol" required>
                <option value="" disabled selected>Seleccione una opcion</option>
                <option value="">Jefe del taller</option>
            </select><br>
            
            <label for="proveedor" id="proveedor">Proveedor</label>
            <select name="" id="" class="proveedor" required>
                <option value="" disabled selected>Seleccione un proveedor</option>
                <option value="">Proveedor 1</option>
                <option value="">Proveedor 2</option>
                <option value="">Proveedor 3</option>
                <option value="">Proveedor 4</option>
                <option value="">Proveedor 5</option>
            </select><br>

            <label for="cantid">Ingrese la cantidad requerida</label>
            <input type="number" name="cantidad" id="cantidad" class="cantidad" required placeholder="Ingrese la cantidad requerida"><br>

            <label for="importancia">Importancia del pedido</label>
            <select name="impor" id="impor" class="importancia">
                <option value="" disabled selected>Seleccione una opcion </option>
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
            </select><br>

            <label for="metodo">Metodo de pago</label>
            <select name="metodo" id="metodo" class="metodo">
                <option value="" selected disabled>Seleccione un    a opcion</option>
                <option value="transferencia">Transferencia</option>
                <option value="efectivo">Efectivo</option>
            </select><br>
        </div>

        <div class="final">
            <button class="rpedido">Realizar Pedido</button>
        </div>
    </div>
</body>
</html>
