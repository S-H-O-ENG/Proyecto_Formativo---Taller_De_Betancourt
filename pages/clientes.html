<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://kit.fontawesome.com/a0994db117.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="../css/clientes.css">
    <link rel="shortcut icon" href="../img/icono.png" type="image/x-icon">
    <title>Clientes - Taller de Betancourt</title>
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="sidebar offcanvas offcanvas-start show" tabindex="-1" id="sidebarMenu">
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo Taller">
                <h2>Taller De Betancourt</h2>
                <p>Gestión de Clientes</p>
            </div>
            <nav class="sidebar-menu">
                <a href="/pages/proveedores.html">
                    <i class="fa-solid fa-truck"></i>
                    Proveedores
                </a>
                <a href="/pages/clientes.html" class="active">
                    <i class="fa-regular fa-user"></i>
                    Clientes
                </a>
                <a href="/pages/pedidos.html">
                    <i class="fa-solid fa-clipboard-list"></i>
                    Pedidos
                </a>
                <a href="../index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Salir
                </a>
            </nav>    
        </aside>
    
        <main class="dashboard-main">

            <header class="topbar">
                <div>
                    <p>Bienvenido</p>
                </div>
                <div class="inventario-info">
                    <i class="fa-regular fa-user"></i>
                    <span>Gestión de Clientes</span>
                </div>
            </header>

            <div class="contenedor-principal">
                <div class="header mb-4">
                    <h2>Gestión y Registro de Clientes</h2>
                    <img src="../img/suprs.png" class="carro" alt="Vehículo decorativo"> 
                </div>

                <section class="registro">
                    <form action="#" method="POST" class="formulario-cliente-vehiculo">
                        
                        <div class="formulario">
                            <h3>Datos del propietario</h3>
                            <div class="datos">
                                <label for="cedula">Cédula:</label>
                                <input type="text" id="cedula" name="cedula" required>
                            </div>
                            <div class="datos">
                                <label for="nombre">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" required>
                            </div>
                            <div class="datos">
                                <label for="apellido">Apellido:</label>
                                <input type="text" id="apellido" name="apellido" required>
                            </div>
                            <div class="datos">
                                <label for="telefono">Teléfono:</label>
                                <input type="tel" id="telefono" name="telefono" required>
                            </div>
                            <div class="datos">
                                <label for="email">Correo Electrónico:</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="formulario">
                            <h3>Datos del vehículo</h3>
                            <div class="datos">
                                <label for="tipo">Tipo de vehículo:</label>
                                <select id="tipo" name="tipo" required>
                                    <option value="">Seleccione un tipo</option>
                                    <option value="automovil">Automóvil</option>
                                    <option value="motocicleta">Motocicleta</option>
                                    <option value="camioneta">Camioneta</option>
                                </select>
                            </div>
                            <div class="datos">
                                <label for="placa">Placa:</label>
                                <input type="text" id="placa" name="placa" class="mayusculas" required>
                            </div>
                            <div class="datos">
                                <label for="marca">Marca:</label>
                                <input type="text" id="marca" name="marca" required>
                            </div>
                            <div class="datos">
                                <label for="modelo">Modelo:</label>
                                <input type="text" id="modelo" name="modelo" required>
                            </div>
                            <div class="datos">
                                <label for="color">Color:</label>
                                <input type="text" id="color" name="color" required>
                            </div>
                        </div>

                        <div class="botones">
                            <button type="reset" class="btnLimpiar">Limpiar</button>
                            <button type="submit" class="btnRegistrar">Registrar Cliente</button>
                        </div>

                    </form>
                </section>
            </div>

        </main>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
