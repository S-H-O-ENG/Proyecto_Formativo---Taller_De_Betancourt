<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Facturas y pagos</title>
<link rel="stylesheet" href="../css/Pro_Facturas.css">
</head>
<body>

<h1>Facturas y pagos</h1>
<p class="subtitulo">Registro y verificación de facturas y pagos</p>

<div class="resumen">

    <div class="resumen-card">
        <p>Por pagar</p>
        <h2>$0</h2>
    </div>

    <div class="resumen-card">
        <p>Pagadas</p>
        <h2 style="color:#4ade80">$0</h2>
    </div>

    <div class="resumen-card">
        <p>Total facturas</p>
        <h2>0</h2>
    </div>

</div>

<div class="top-bar">
    <h3>Registro de facturas y pagos</h3>
    <button class="btn" id="abrirModal">+ Registrar factura</button>
</div>


<div class="table-responsive mt-4">

    <table class="table table-dark table-hover align-middle tabla">

        <thead>
            <tr>
                <th>N° Factura</th>
                <th>Proveedor</th>
                <th>Orden</th>
                <th>Fecha</th>
                <th>Monto</th>
                <th>Pago</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            

        </tbody>

    </table>

</div>

<div id="modalFactura" class="modal">

    <div class="contenido-modal">

        <span id="cerrar">times;</span>

        <h2>Registrar Factura</h2>

        <form id="formFactura">

            <input type="text" id="numero" placeholder="Número de factura" required>

            <input type="text" id="proveedor" placeholder="Proveedor" required>

            <input type="text" id="orden" placeholder="Orden de compra" required>

            <input type="date" id="fecha" required>

            <input type="number" id="monto" placeholder="Monto" required>

            <button type="submit">
                Guardar Factura
            </button>

        </form>

    </div>

</div>



<script src="../js/Pro_Facturas.js"></script>

</body>
</html>
